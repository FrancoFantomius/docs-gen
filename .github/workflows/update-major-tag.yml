name: Update Major Tag

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to update major version for (e.g. v1.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-major-tag:
    name: Update Major Version Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update major tag
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name }}"

          if [ -z "$TAG" ]; then
            echo "Error: Could not determine tag name."
            exit 1
          fi

          echo "Target tag: $TAG"

          # Only update for semantic version tags like v1.2.0 (ignores pre-releases like v1.2.0-beta)
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag $TAG is not a standard release tag (vX.Y.Z). Skipping major tag update."
            exit 0
          fi

          MAJOR_TAG="v${BASH_REMATCH[1]}"
          echo "Updating major tag: $MAJOR_TAG -> $TAG"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Force update the major tag to point to the release commit
          git tag -fa "$MAJOR_TAG" "$TAG^{commit}" -m "Update $MAJOR_TAG to $TAG"
          git push origin "$MAJOR_TAG" --force


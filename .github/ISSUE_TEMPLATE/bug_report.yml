name: Bug Report
description: Create a report to help us fix a defect or issue with docs-gen
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much context as possible.
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: What happened? What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or minimal reproduction example.
      placeholder: |
        1. Run 'docs-gen ...'
        2. With markdown file '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide runtime environment details.
      value: |
        - OS: [e.g. Windows 11, macOS Sequoia, Ubuntu 22.04]
        - Node.js version: [e.g. 20.12.0]
        - @francofantomius/docs-gen version: [e.g. 1.0.0]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Output
      description: Paste any error traces or terminal output.
      render: shell


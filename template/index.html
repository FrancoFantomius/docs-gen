<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="__SITE_DESCRIPTION__" />
    <link rel="icon" type="image/svg+xml" href="./menu_book.svg" />
    <!-- Google Material Symbols Outlined font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <!-- Google Roboto font -->

  <body>
    <div class="docs-app">
      <!-- Fixed Top App Bar -->
      <header class="docs-header">
        <md-top-app-bar id="docs-top-bar" variant="small" headline="__SITE_TITLE__">
          <md-icon-button id="menu-nav-btn" slot="navigation" icon="menu" aria-label="Open navigation menu"></md-icon-button>

          <md-search-bar
            id="docs-search-bar"
            slot="actions"
            size="small"
            placeholder="Search documentation..."
            show-back-button
            show-clear-button
            responsive
          ></md-search-bar>

          <div class="palette-picker-wrapper" slot="actions">
            <md-icon-button id="palette-picker-btn" aria-label="Change color palette" title="Change color palette">
              <md-icon name="palette"></md-icon>
            </md-icon-button>
            <div id="palette-menu" class="palette-menu" role="dialog" aria-label="Select color palette" hidden>
              <div class="palette-menu-title">Color Palette (16 Colors)</div>
              <div class="palette-grid" id="palette-grid"></div>
              <div class="palette-menu-footer">
                <button type="button" id="reset-palette-btn" class="palette-reset-btn">
                  <md-icon name="restart_alt"></md-icon>
                  <span>Reset to Auto / System</span>
                </button>
              </div>
            </div>
          </div>

          <md-icon-button id="theme-toggle-btn" slot="actions" aria-label="Toggle theme mode" title="Toggle theme (Light / Dark / System)">
            <md-icon id="theme-icon" name="brightness_auto"></md-icon>
          </md-icon-button>

          <md-icon-button
            id="github-link-btn"
            slot="actions"
            aria-label="GitHub Repository"
            title="GitHub Repository"
            href="__GITHUB_URL__"
            target="_blank"
          >
            <md-icon>
              <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">

              </svg>

          </md-icon-button>
        </md-top-app-bar>
      </header>

      <!-- Main Layout -->
      <div class="docs-main-container">
        <!-- Responsive Navigation Drawer -->
        <md-navigation-drawer id="docs-drawer" responsive headline="Documentation">
          <!-- Populated dynamically by docs.js -->
        </md-navigation-drawer>

        <!-- Main Content Viewport -->
        <main id="docs-content" class="docs-content" role="main">
          <!-- Dynamic SPA content rendered here by docs.js -->
        </main>
      </div>

      <!-- Global Snackbar Notification -->
      <md-snackbar id="global-snackbar" message="Copied to clipboard!" closeable timeout-ms="3000"></md-snackbar>
    </div>

    <script type="module" src="./docs.js"></script>
